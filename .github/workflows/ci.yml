name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest versions: PHPUnit 11.5, the newest line that runs on PHP 8.2.
          - php: '8.2'
            dependencies: lowest
          # Highest versions resolve to PHPUnit 12 on PHP 8.3 and to PHPUnit 13 from PHP 8.4.
          - php: '8.3'
            dependencies: highest
          - php: '8.4'
            dependencies: highest
          - php: '8.5'
            dependencies: highest
    steps:
      - uses: actions/checkout@v4
        with:
          # Composer and npm run code of other packages in this checkout.
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pdo_sqlite: some tests read a table from a real database. intl: one
          # test of the search needs it. Neither is needed to use the library.
          extensions: mbstring, intl, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          else
            composer update --no-interaction --no-progress
          fi

      - name: Show resolved versions
        run: composer show | grep -E '^phpunit/phpunit '

      - name: Validate composer.json
        run: composer validate --strict

      # A test that is left out here would not run anywhere.
      - name: PHPUnit
        run: vendor/bin/phpunit --fail-on-skipped

  browser:
    name: Browser (Playwright, example tools and website)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Composer and npm run code of other packages in this checkout.
          persist-credentials: false

      # The oldest PHP the package supports.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none

      # The example tools only need the autoloader. The library has no runtime dependencies.
      - name: Install the library
        run: composer install --no-dev --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            site/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: e2e
        run: npx playwright test

      # The first page of the website has two pictures that a visitor can use. They are
      # simulations, so they are used here in a browser, and what the picture of one click says
      # is compared with the real site/samples/hello.php, run by the library.
      - name: Build the website
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Run the browser tests of the website
        working-directory: e2e
        run: npx playwright test -c site

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/site/playwright-report
            e2e/site/test-results
          retention-days: 7

  frameworks:
    name: Frameworks (Laravel ${{ matrix.laravel }}, Symfony ${{ matrix.symfony }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest PHP the package supports, with the newest versions that run on it.
          - php: '8.2'
            laravel: '^12.0'
            symfony: '7.4.*'
          - php: '8.5'
            laravel: '^13.0'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v4
        with:
          # Composer and npm run code of other packages in this checkout.
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A fresh Laravel and a fresh Symfony, with the library installed from this checkout.
      # They are created in the temp folder of the system, outside the checkout: each holds a link back to it.
      - name: Set up Laravel and Symfony
        working-directory: e2e
        env:
          LARAVEL: ${{ matrix.laravel }}
          SYMFONY: ${{ matrix.symfony }}
        run: node frameworks/setup.mjs

      - name: Run the tools inside both
        working-directory: e2e
        run: npx playwright test -c frameworks

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frameworks-report-php-${{ matrix.php }}
          path: |
            e2e/frameworks/playwright-report
            e2e/frameworks/test-results
          retention-days: 7

  website:
    name: Website (build and check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # npm runs code of other packages in this checkout.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The build needs no PHP: the page of all functions is read from the doc comments as text.
      # It starts with the tests of the live pictures of the first page (npm test).
      # After VitePress, site/tools/check.mjs looks for what a build does not notice: a part of
      # the README that the website reads in and that is gone, a link to a heading that was
      # renamed, a tutorial that names a line of a demo tool that has moved.
      - name: Build the website
        working-directory: site
        run: |
          npm ci
          npm run build
